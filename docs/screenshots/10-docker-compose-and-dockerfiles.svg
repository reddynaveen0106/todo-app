amily="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      DB_HOST: db</text><text x="52" y="546" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">23</text><text x="98" y="546" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      POSTGRES_USER: ${POSTGRES_USER}</text><text x="52" y="564" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">24</text><text x="98" y="564" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}</text><text x="52" y="582" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">25</text><text x="98" y="582" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      POSTGRES_DB: ${POSTGRES_DB}</text><text x="52" y="600" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">26</text><text x="98" y="600" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">    depends_on:</text><text x="52" y="618" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">27</text><text x="98" y="618" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      db:</text><text x="52" y="636" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">28</text><text x="98" y="636" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">        condition: service_healthy</text><text x="52" y="654" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">29</text><text x="98" y="654" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">    ports:</text><text x="52" y="672" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">30</text><text x="98" y="672" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1">      - &quot;${BACKEND_PORT}:8088&quot;</text><text x="52" y="690" font-family="DejaVu Sans Mono,mon