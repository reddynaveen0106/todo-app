e="11.5" fill="#80d4ff">FROM nginx:alpine</text><text x="52" y="1626" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">9</text><text x="98" y="1626" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">COPY --from=build /app/dist /usr/share/nginx/html</text><text x="52" y="1644" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">10</text><text x="98" y="1644" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">COPY nginx.conf /etc/nginx/conf.d/default.conf</text><text x="52" y="1662" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">11</text><text x="98" y="1662" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">EXPOSE 80</text><text x="52" y="1680" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">12</text><text x="98" y="1680" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">CMD [&quot;nginx&quot;, &quot;-g&quot;, &quot;daemon off;&quot;]</text></svg>