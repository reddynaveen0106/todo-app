TH&quot;</text><text x="52" y="1086" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">6</text><text x="98" y="1086" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">COPY requirements.txt .</text><text x="52" y="1104" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">7</text><text x="98" y="1104" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">RUN pip install --no-cache-dir -r requirements.txt</text><text x="52" y="1122" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">8</text><text x="98" y="1122" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#dce6f1"> </text><text x="52" y="1140" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">9</text><text x="98" y="1140" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#8ca5be"># Runtime stage</text><text x="52" y="1158" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">10</text><text x="98" y="1158" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">FROM python:3.12-slim</text><text x="52" y="1176" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">11</text><text x="98" y="1176" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">WORKDIR /app</text><text x="52" y="1194" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">12</text><text x="98" y="1194" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">ENV PATH=&quot;/opt/venv/bin:$PATH&quot;</text><text x="52" y="1212" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">13</text><text x="98" y="1212" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#80d4ff">ENV PYTHONDONTWRITEBYTECODE=1</text><text x="52" y="1230" font-family="DejaVu Sans Mono,monospace" font-size="11.5" fill="#71869d">14</text><text x="98" y="1230" font-family="DejaVu Sans